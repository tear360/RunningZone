name: runningzone
description: RunningZone - capture territory by running loops on the map of France.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.3.0
  shared_preferences: ^2.5.2
  package_info_plus: ^8.2.1
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  open_filex: ^4.6.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
