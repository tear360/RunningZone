name: Release Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://run.chorizo.dpdns.org' }} \
            --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/RunningZone-${VERSION}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/flutter-apk/RunningZone-*.apk
          generate_release_notes: true
