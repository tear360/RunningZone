name: Build iOS (unsigned)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://run.chorizo.dpdns.org' }} \
            --dart-define=GITHUB_REPO=${{ github.repository }}

      - name: Package unsigned app
        run: |
          cd build/ios/iphoneos
          zip -r ../../../RunningZone-ios-unsigned.app.zip Runner.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RunningZone-ios-unsigned
          path: app/build/RunningZone-ios-unsigned.app.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/RunningZone-ios-unsigned.app.zip
